<style>
  :root{
    --bg:#0a0c10;
    --bg2:#0e1117;
    --panel:#141822;
    --panel-border:#242938;
    --text:#e8eaf0;
    --text-dim:#8992a6;
    --text-faint:#4b5163;
    --accent:#5b8ff0;
    --company:#d8975a;
    --tech:#e35d5d;
    --industry:#5b8ff0;
    --competitor:#e069a8;
    --government:#e0c23e;
    --agenda:#4caf7d;
    --material:#8a8f98;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:radial-gradient(ellipse at 50% 30%, var(--bg2) 0%, var(--bg) 70%);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    overflow:hidden;
  }
  #app{position:fixed; inset:0;}

  header{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px; pointer-events:none;
  }
  header .title-block{pointer-events:none;}
  header h1{
    margin:0; font-size:17px; font-weight:700; letter-spacing:0.2px; color:var(--text);
  }
  header p{
    margin:4px 0 0; font-size:12px; color:var(--text-dim);
  }

  #searchWrap{
    pointer-events:auto;
    display:flex; align-items:center; gap:8px;
    background:rgba(20,24,34,0.85);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:9px 14px;
    backdrop-filter: blur(10px);
    min-width:260px;
  }
  #searchWrap svg{flex:none; opacity:0.55;}
  #searchInput{
    flex:1;
    background:transparent; border:none; outline:none;
    color:var(--text); font-size:14px;
    font-family:inherit;
  }
  #searchInput::placeholder{color:var(--text-faint);}
  #searchCount{font-size:11px; color:var(--text-faint); white-space:nowrap;}
  #clearBtn{
    display:none; cursor:pointer; border:none; background:none; color:var(--text-dim);
    font-size:14px; padding:0 2px; line-height:1;
  }
  #clearBtn:hover{color:var(--text);}

  #legend{
    position:absolute; left:24px; bottom:24px; z-index:20;
    background:rgba(20,24,34,0.85);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:14px 16px;
    backdrop-filter: blur(10px);
    font-size:12px;
    max-width:200px;
  }
  #legend .lg-title{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:10px;}
  #legend .lg-row{display:flex; align-items:center; gap:8px; margin:6px 0; cursor:pointer; user-select:none; opacity:1; transition:opacity .15s;}
  #legend .lg-row.dim{opacity:0.35;}
  #legend .lg-dot{width:11px; height:11px; border-radius:50%; flex:none;}
  #legend .lg-row span.lbl{color:var(--text-dim); font-size:12px;}
  #legend .lg-sep{height:1px; background:var(--panel-border); margin:10px 0;}
  #legend .lg-mat{width:7px; height:7px; border-radius:50%; background:var(--material); flex:none;}

  #tooltip{
    position:absolute; z-index:30; pointer-events:none;
    background:rgba(18,21,30,0.96); border:1px solid var(--panel-border);
    border-radius:8px; padding:8px 11px; font-size:12.5px; color:var(--text);
    max-width:280px; line-height:1.45; display:none;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
  }
  #tooltip .tt-cat{color:var(--text-dim); font-size:10.5px; margin-top:2px;}

  #hint{
    position:absolute; right:24px; bottom:24px; z-index:20;
    font-size:11px; color:var(--text-faint);
    background:rgba(20,24,34,0.7); border:1px solid var(--panel-border);
    border-radius:10px; padding:10px 13px; backdrop-filter: blur(10px);
    line-height:1.6;
  }

  #graphSvg{width:100%; height:100%; display:block; cursor:grab;}
  #graphSvg:active{cursor:grabbing;}

  .node{cursor:pointer;}
  .node-circle{transition:opacity .25s, stroke-width .15s;}
  .node.dim .node-circle{opacity:0.10;}
  .node.dim .node-label{opacity:0.06;}
  .node.highlight .node-circle{stroke:#fff; stroke-width:2.2;}
  .node-label{
    fill:var(--text-dim); font-size:10.5px; pointer-events:none;
    paint-order:stroke; stroke:rgba(6,7,10,0.85); stroke-width:3px; stroke-linejoin:round;
    transition:opacity .25s;
  }
  .node.entity .node-label{fill:#d8dce6; font-size:11.5px; font-weight:600;}
  .link{stroke:#4a5468; stroke-opacity:0.35; fill:none; transition:opacity .25s, stroke .2s;}
  .link.dim{opacity:0.04;}
  .link.highlight{stroke:#8fb2ff; stroke-opacity:0.85;}
</style>

const MATERIALS = [

  {url:"https://app.notion.com/382eef5aeac1809db3dfd6a45b0e9cbe", name:"2. One Model, Any Scenario", entity:"https://app.notion.com/382eef5aeac180ef95c7cfd69cb2298c"},
  {url:"https://app.notion.com/382eef5aeac180b0ae4fd8970b243ef0", name:"1. Skild AI의 모든 것", entity:"https://app.notion.com/382eef5aeac180ef95c7cfd69cb2298c"},
  {url:"https://app.notion.com/39beef5aeac181378740d749f60609d1", name:"엔비디아·허깅페이스, 휴머노이드 VLA 모델 'Isaac GR00T 1.7'을 오픈소스 LeRobot에 통합", entity:"https://app.notion.com/382eef5aeac1811abf90d96575c6d392"},
  {url:"https://app.notion.com/39beef5aeac181f29966c405f7dc65ea", name:"RoboCup 2026, 인천서 사상 첫 11대11 휴머노이드 로봇 축구 경기 개최", entity:null},
  {url:"https://app.notion.com/39beef5aeac181feba43ddf950b6b323", name:"포춘: 'Physical AI'—50조 달러 기회와 에너지·하드웨어 병목", entity:"https://app.notion.com/388eef5aeac180ef9e21fc377b2ef276"},
  {url:"https://app.notion.com/39beef5aeac1812298e4df8bd1395a23", name:"앤트그룹 로보얀트, 인과적 비디오-액션 모델 'LingBot-VA 2.0' 공개", entity:"https://app.notion.com/382eef5aeac1811abf90d96575c6d392"},
  {url:"https://app.notion.com/39beef5aeac1812caeade2a86b77ab17", name:"중국, 올해 휴머노이드 로봇 생산 10만 대 돌파 전망…AI 핵심산업 230조원", entity:"https://app.notion.com/382eef5aeac181399d94f122cb58c134"},
  {url:"https://app.notion.com/39beef5aeac1813f9532f43073e4f55e", name:"로보얀트, 오픈소스 VLA 모델 'LingBot-VLA 2.0' 공개", entity:"https://app.notion.com/382eef5aeac1811abf90d96575c6d392"}

/* ---------------- 노드 / 엣지 구성 ---------------- */
const catAnchorOrder = ["company","tech","industry","competitor","government","agenda"];
const W = 1600, H = 1000, CX = W/2, CY = H/2, ANCHOR_R = 330;
const catAnchors = {};
catAnchorOrder.forEach((c,i)=>{
  const a = (Math.PI*2*i/catAnchorOrder.length) - Math.PI/2;
  catAnchors[c] = {x: CX + Math.cos(a)*ANCHOR_R, y: CY + Math.sin(a)*ANCHOR_R};
});

const nodes = [];
const nodeById = {};
ENTITIES.forEach(e=>{
  const n = {id:e.url, type:"entity", name:e.name, cat:e.cat, url:e.url, degree:0};
  nodes.push(n); nodeById[n.id]=n;
});
MATERIALS.forEach(m=>{
  const n = {id:m.url, type:"material", name:m.name, url:m.url, entity:m.entity, degree:0};
  nodes.push(n); nodeById[n.id]=n;
});

const links = [];
MATERIALS.forEach(m=>{
  if(m.entity && nodeById[m.entity]){
    links.push({source:m.url, target:m.entity});
    nodeById[m.url].degree++;
    nodeById[m.entity].degree++;
  }
});

// radius
nodes.forEach(n=>{
  if(n.type==="entity"){
    n.r = Math.min(40, 15 + n.degree*7);
  } else {
    n.r = 4.5 + n.degree*0.8;
  }
});

/* ---------------- 초기 배치 ---------------- */
nodes.forEach(n=>{
  let base;
  if(n.type==="entity"){
    base = catAnchors[n.cat];
  } else if(n.entity && catAnchors[nodeById[n.entity].cat]){
    base = catAnchors[nodeById[n.entity].cat];
  } else {
    base = {x:CX, y:CY};
  }
  const jitter = 90;
  n.x = base.x + (Math.random()-0.5)*jitter*2;
  n.y = base.y + (Math.random()-0.5)*jitter*2;
  n.vx = 0; n.vy = 0;
});

/* ---------------- 간단한 force simulation ---------------- */
function simulate(steps){
  for(let s=0; s<steps; s++){
    const alpha = Math.max(0.02, 1 - s/steps);
    // repulsion
    for(let i=0;i<nodes.length;i++){
      const a = nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b = nodes[j];
        let dx = a.x-b.x, dy = a.y-b.y;
        let dist2 = dx*dx+dy*dy;
        if(dist2 < 1) dist2 = 1;
        const dist = Math.sqrt(dist2);
        const minDist = a.r+b.r+18;
        let force = (2600 / dist2) * alpha;
        if(dist < minDist){ force += (minDist-dist)*0.06; }
        const fx = (dx/dist)*force, fy=(dy/dist)*force;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
      }
    }
    // links
    links.forEach(l=>{
      const a = nodeById[l.source], b = nodeById[l.target];
      let dx=b.x-a.x, dy=b.y-a.y;
      let dist = Math.sqrt(dx*dx+dy*dy)||1;
      const target = a.r+b.r+50;
      const force = (dist-target)*0.02*alpha*4;
      const fx=(dx/dist)*force, fy=(dy/dist)*force;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    });
    // category anchor pull (entities only, weak)
    nodes.forEach(n=>{
      if(n.type==="entity"){
        const anc = catAnchors[n.cat];
        n.vx += (anc.x-n.x)*0.012*alpha;
        n.vy += (anc.y-n.y)*0.012*alpha;
      } else if(!n.entity){
        n.vx += (CX-n.x)*0.006*alpha;
        n.vy += (CY-n.y)*0.006*alpha;
      }
      // gentle global center gravity
      n.vx += (CX-n.x)*0.0015*alpha;
      n.vy += (CY-n.y)*0.0015*alpha;
    });
    // integrate
    nodes.forEach(n=>{
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += n.vx; n.y += n.vy;
    });
  }
}
simulate(360);

  const a = nodeById[l.source], b = nodeById[l.target];
  el.setAttribute("x1",a.x); el.setAttribute("y1",a.y);
  el.setAttribute("x2",b.x); el.setAttribute("y2",b.y);
  linkGroup.appendChild(el);
  return {el, l};
});

const catColorVar = {
  company:"var(--company)", tech:"var(--tech)", industry:"var(--industry)",
  competitor:"var(--competitor)", government:"var(--government)", agenda:"var(--agenda)"
};

const nodeEls = nodes.map(n=>{
  const g = document.createElementNS(svgNS,"g");
  g.setAttribute("class","node " + n.type);
  g.setAttribute("transform", `translate(${n.x},${n.y})`);

  const circle = document.createElementNS(svgNS,"circle");
  circle.setAttribute("class","node-circle");
  circle.setAttribute("r", n.r);
  if(n.type==="entity"){
    circle.setAttribute("fill", catColorVar[n.cat]);
    circle.setAttribute("fill-opacity","0.88");
    circle.setAttribute("stroke", catColorVar[n.cat]);
    circle.setAttribute("stroke-width","1");
  } else {
    circle.setAttribute("fill", "var(--material)");
    circle.setAttribute("fill-opacity","0.75");
  }
  g.appendChild(circle);

  const label = document.createElementNS(svgNS,"text");
  label.setAttribute("class","node-label");
  label.setAttribute("text-anchor","middle");
  label.setAttribute("y", -(n.r+7));
  const shortName = n.type==="material" && n.name.length>22 ? n.name.slice(0,21)+"…" : n.name;
  label.textContent = shortName;
  g.appendChild(label);

  const title = document.createElementNS(svgNS,"title");
  title.textContent = n.name;
  g.appendChild(title);

  g.addEventListener("click", (ev)=>{
    ev.stopPropagation();
    window.open(n.url, "_blank", "noopener");
  });
  g.addEventListener("mouseenter", (ev)=> showTooltip(n, ev));
  g.addEventListener("mousemove", (ev)=> moveTooltip(ev));
  g.addEventListener("mouseleave", hideTooltip);

  nodeGroup.appendChild(g);
  return {el:g, n};
});

/* ---------------- 툴팁 ---------------- */
const tooltip = document.getElementById("tooltip");
const catLabelKo = {company:"우리 회사", tech:"기반 기술", industry:"적용 산업", competitor:"경쟁 및 파트너", government:"정부/국가", agenda:"AI 전방위 통합 아젠다"};
function showTooltip(n, ev){
  tooltip.style.display="block";
  const catLine = n.type==="entity" ? `<div class="tt-cat">${catLabelKo[n.cat]} · 연결 ${n.degree}개</div>` : `<div class="tt-cat">자료${n.entity? " · " + (nodeById[n.entity]?nodeById[n.entity].name:"") : ""}</div>`;
  tooltip.innerHTML = `<div>${n.name}</div>${catLine}`;
  moveTooltip(ev);
}
function moveTooltip(ev){
  tooltip.style.left = (ev.clientX+16)+"px";
  tooltip.style.top = (ev.clientY+14)+"px";
}
function hideTooltip(){ tooltip.style.display="none"; }

/* ---------------- 검색 / 하이라이트 ---------------- */
const searchInput = document.getElementById("searchInput");
const searchCount = document.getElementById("searchCount");
const clearBtn = document.getElementById("clearBtn");

function neighborsOf(id){
  const set = new Set();
  links.forEach(l=>{
    if(l.source===id) set.add(l.target);
    if(l.target===id) set.add(l.source);
  });
  return set;
}

function applyFilter(query){
  const q = query.trim().toLowerCase();
  clearBtn.style.display = q ? "block" : "none";
  if(!q){
    nodeEls.forEach(({el})=>{ el.classList.remove("dim","highlight"); });
    linkEls.forEach(({el})=>{ el.classList.remove("dim","highlight"); });
    searchCount.textContent = "";
    return;
  }
  const matched = new Set();
  nodes.forEach(n=>{ if(n.name.toLowerCase().includes(q)) matched.add(n.id); });

  const active = new Set(matched);
  matched.forEach(id=>{ neighborsOf(id).forEach(nb=>active.add(nb)); });

  nodeEls.forEach(({el,n})=>{
    if(active.has(n.id)){
      el.classList.remove("dim");
      el.classList.toggle("highlight", matched.has(n.id));
    } else {
      el.classList.add("dim");
      el.classList.remove("highlight");
    }
  });
  linkEls.forEach(({el,l})=>{
    const on = active.has(l.source) && active.has(l.target);
    el.classList.toggle("dim", !on);
    el.classList.toggle("highlight", matched.has(l.source)||matched.has(l.target));
  });
  searchCount.textContent = matched.size ? `${matched.size}개 일치` : "일치 없음";
}

searchInput.addEventListener("input", ()=> applyFilter(searchInput.value));
clearBtn.addEventListener("click", ()=>{ searchInput.value=""; applyFilter(""); searchInput.focus(); });

/* ---------------- 범례 카테고리 클릭 필터 ---------------- */
document.querySelectorAll("#legend .lg-row").forEach(row=>{
  row.addEventListener("click", ()=>{
    const cat = row.dataset.cat;
    const isActive = row.classList.contains("active");
    document.querySelectorAll("#legend .lg-row").forEach(r=>r.classList.remove("active","dim"));
    if(isActive){
      nodeEls.forEach(({el})=> el.classList.remove("dim","highlight"));
      linkEls.forEach(({el})=> el.classList.remove("dim","highlight"));
      return;
    }
    row.classList.add("active");
    document.querySelectorAll("#legend .lg-row").forEach(r=>{ if(r!==row) r.classList.add("dim"); });

    const activeIds = new Set();
    nodes.forEach(n=>{
      const match = cat==="material" ? n.type==="material" : (n.type==="entity" && n.cat===cat);
      if(match) activeIds.add(n.id);
    });
    if(cat!=="material"){
      links.forEach(l=>{
        if(activeIds.has(l.source)) activeIds.add(l.target);
        if(activeIds.has(l.target)) activeIds.add(l.source);
      });
    }
    nodeEls.forEach(({el,n})=>{
      el.classList.toggle("dim", !activeIds.has(n.id));
      el.classList.toggle("highlight", n.type==="entity" && n.cat===cat);
    });
    linkEls.forEach(({el,l})=>{
      el.classList.toggle("dim", !(activeIds.has(l.source)&&activeIds.has(l.target)));
    });
  });
});

/* ---------------- 팬 / 줌 ---------------- */
let viewX=0, viewY=0, viewScale=1;
let isPanning=false, panStart={x:0,y:0}, viewStart={x:0,y:0};

function updateTransform(){
  zoomGroup.setAttribute("transform", `translate(${viewX},${viewY}) scale(${viewScale})`);
}

svg.addEventListener("mousedown",(e)=>{
  isPanning = true;
  panStart = {x:e.clientX, y:e.clientY};
  viewStart = {x:viewX, y:viewY};
});
window.addEventListener("mousemove",(e)=>{
  if(!isPanning) return;
  viewX = viewStart.x + (e.clientX-panStart.x);
  viewY = viewStart.y + (e.clientY-panStart.y);
  updateTransform();
});
window.addEventListener("mouseup", ()=> isPanning=false);

svg.addEventListener("wheel",(e)=>{
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const prevScale = viewScale;
  const delta = -e.deltaY*0.0016;
  viewScale = Math.min(4, Math.max(0.35, viewScale*(1+delta)));
  // zoom toward cursor
  viewX = mx - (mx-viewX)*(viewScale/prevScale);
  viewY = my - (my-viewY)*(viewScale/prevScale);
  updateTransform();
},{passive:false});

// initial fit: center graph, slight zoom-out since viewBox already covers full canvas
updateTransform();
</script>
